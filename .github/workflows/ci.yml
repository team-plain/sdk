name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # The build regenerates the SDK from the committed schema, so any diff means a generated file
      # was edited by hand or not regenerated after a schema or generator change.
      - name: Check generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated files are out of date. Run pnpm build and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build

      # Raw size, not compressed: an unminified build can be twice the size and gzip the same.
      - name: Check the built JS stays within its size limits
        run: pnpm exec size-limit

      - name: Check exports and types resolve in every module mode
        run: |
          for pkg in graphql ui-components webhooks; do
            pnpm exec attw --pack "packages/$pkg"
            pnpm exec publint "packages/$pkg"
          done

      - name: Install the packed packages and load them
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm -r --filter "./packages/*" --filter "!@team-plain/graphql-codegen-plugin" \
            exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz
          export PACKAGES='["@team-plain/graphql","@team-plain/ui-components","@team-plain/webhooks"]'
          node -e 'for (const p of JSON.parse(process.env.PACKAGES)) if (!Object.keys(require(p)).length) throw new Error(p)'
          node --input-type=module -e 'for (const p of JSON.parse(process.env.PACKAGES)) if (!Object.keys(await import(p)).length) throw new Error(p)'
