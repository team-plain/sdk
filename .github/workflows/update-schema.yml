name: Update schema

on:
  schedule:
    # Mondays, so a week of API changes lands as one reviewable pull request.
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pull requests opened with the default token don't trigger CI, so push and open them as the app.
      - name: Generate a GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.GH_WORKFLOW_APP_PRIVATE_KEY }}

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Build the codegen plugin
        run: pnpm --filter @team-plain/graphql-codegen-plugin build

      - name: Download the schema and regenerate
        id: update
        run: pnpm --filter @team-plain/graphql update-schema

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: Regenerate against the current API schema (${{ steps.update.outputs.bump }})
          BODY: The scheduled schema update found changes. Review the generated changeset before merging.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C schema/update
          git add -A
          git commit -m "$TITLE"
          git push --force origin schema/update
          open=$(gh pr list --head schema/update --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "$TITLE" --body "$BODY"
          else
            gh pr create --head schema/update --title "$TITLE" --body "$BODY"
          fi
