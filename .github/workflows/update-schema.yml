name: Update schema

on:
  schedule:
    # Mondays, so a week of API changes lands as one reviewable pull request.
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pull requests opened with the default token don't trigger CI, so push and open them as the app.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.GH_WORKFLOW_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @team-plain/graphql-codegen-plugin build
      - id: update
        run: pnpm --filter @team-plain/graphql update-schema
      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUMP: ${{ steps.update.outputs.bump }}
          CHANGESET: ${{ steps.update.outputs.changeset }}
          BRANCH: schema/update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Regenerate against the current API schema"
          git push --force origin "$BRANCH"

          title="Regenerate against the current API schema ($BUMP)"
          {
            echo "The scheduled schema update found changes. The changeset below was generated from the schema diff; edit it before merging if a change needs a migration note."
            echo
            # Everything after the frontmatter's closing ---.
            awk 'seen >= 2; /^---$/ { seen++ }' "$CHANGESET"
          } > "$RUNNER_TEMP/body.md"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
