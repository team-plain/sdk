---
version: 2

updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      time: "10:30"
      timezone: "Europe/London"
    groups:
      gha-deps:
        patterns:
          - "*"
    directory: "/"

  - package-ecosystem: npm
    directory: "/"
    # Must be at least minimumReleaseAge in pnpm-workspace.yaml (minutes; 10080 is 7
    # days).
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      time: "10:30"
      timezone: "Europe/London"
    versioning-strategy: increase
    open-pull-requests-limit: 15
    groups:
      npm-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
      # Without group-by, every major lands in one combined PR.
      npm-major:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Tracks the runtime, not latest. Raise it with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
