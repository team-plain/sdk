packages:
  - "packages/*"

saveExact: true

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false

trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  # Its postinstall only prints a message; nothing needs it to run.
  es5-ext: false

# pnpm 12 writes its own pinned version as a first YAML document in
# pnpm-lock.yaml, and GitHub's dependency graph reads only that document, so
# Dependabot sees no dependencies. CI installs the pinned pnpm through
# pnpm/setup. https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore

overrides:
  # Tracks the minimum supported runtime in engines.node, not latest.
  "@types/node": ^24.0.0
  # Security floor: graphql-config (via @graphql-codegen/cli) still takes minimatch on ^10, and
  # no 10.x release fixes GHSA-g3hv-75wg-m249. It only calls minimatch(), which 11 keeps.
  # Drop once graphql-config takes ^11.
  graphql-config>minimatch: ^11.0.1
