schema: ./src/schema.graphql
documents: ./src/_generated_documents.graphql
# Skip the OverlappingFieldsCanBeMerged validation rule. This rule incorrectly
# flags field conflicts between different concrete types in a union/interface
# (e.g. ComponentText.size: ComponentTextSize vs ComponentSpacer.size: ComponentSpacerSize).
# These fields can never coexist at runtime, so the conflicts are false positives.
config:
  skipDocumentsValidation:
    ignoreRules:
      - OverlappingFieldsCanBeMergedRule
generates:
  ./src/_generated_documents.ts:
    documentTransforms:
      - ./scripts/make-nullable-fields-optional.ts
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      avoidOptionals: false
      enumsAsTypes: true
      nonOptionalTypename: false
      importSchemaTypesFrom: ./src/_generated_documents.ts
      namespacedImportName: ""
      scalars:
        ID: string
      enumType: string-literal
      skipTypename: true
      # Each document is built by the SDK's own tag from its query text rather than inlined as an AST,
      # about a quarter of the size, and fragments are shared between documents rather than copied
      # into each one.
      documentMode: graphQLTag
      gqlImport: ./lazy-document.js#gql
      useTypeImports: true
      # Marks each document's construction side-effect free, so bundlers can drop documents an app
      # never uses, starting with the fragment documents the SDK itself never imports. Takes effect
      # once compact-documents.ts turns each template into a call.
      pureMagicComment: true
    hooks:
      afterOneFileWrite:
        - node scripts/compact-documents.ts
  ./src/_generated_sdk.ts:
    plugins:
      - "@team-plain/graphql-codegen-plugin"
